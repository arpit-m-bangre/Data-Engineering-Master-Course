name: 🚀 Auto-Deploy Dashboard to Vercel

# Triggers: ANY push to main that touches TODAYS_TASKS.txt, the dashboard code, or this workflow itself
on:
  push:
    branches:
      - main
    paths:
      - 'TODAYS_TASKS.txt'
      - 'dashboard/**'
      - 'DASHBOARD/**'
      - '.github/workflows/deploy-dashboard.yml'

# Allow only one concurrent deployment at a time
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      # ─── 1. Checkout full repo ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Setup Node.js ────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # ─── 3. Install dependencies inside dashboard/ ───────────────────────
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci

      # ─── 4. Copy TODAYS_TASKS.txt → dashboard/public/ (prebuild) ─────────
      - name: Copy TODAYS_TASKS.txt to public folder
        working-directory: ./dashboard
        run: node copy_tasks.cjs

      # ─── 5. Vite production build ─────────────────────────────────────────
      - name: Build Vite app
        working-directory: ./dashboard
        run: npx vite build

      # ─── 6. Deploy dist/ to Vercel ────────────────────────────────────────
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./dashboard
          vercel-args: '--prod'
