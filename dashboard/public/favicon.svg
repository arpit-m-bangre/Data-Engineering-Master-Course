<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="walleMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="opticGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Pippo Cybernetic Crest / Aura (Top Left) -->
  <path d="M 12 18 C 14 10, 22 8, 28 14 C 24 16, 20 20, 18 26 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="16" cy="14" r="2" fill="#fff" opacity="0.9"/>

  <!-- WALL-E Binocular Head Unit Bridge -->
  <path d="M 28 28 L 36 28 L 34 32 L 30 32 Z" fill="url(#walleMetal)"/>
  <circle cx="32" cy="30" r="1.5" fill="#f59e0b"/>

  <!-- WALL-E Left Eye / Optical Visor -->
  <g transform="rotate(-6 22 28)">
    <rect x="13" y="20" width="17" height="15" rx="5" fill="url(#walleMetal)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="21.5" cy="27.5" r="5.2" fill="#030712"/>
    <circle cx="21.5" cy="27.5" r="4" fill="url(#opticGlow)" filter="url(#neon)"/>
    <circle cx="21.5" cy="27.5" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="23" cy="26" r="0.9" fill="#ffffff"/>
  </g>

  <!-- WALL-E Right Eye / Optical Visor -->
  <g transform="rotate(6 42 28)">
    <rect x="34" y="20" width="17" height="15" rx="5" fill="url(#walleMetal)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="42.5" cy="27.5" r="5.2" fill="#030712"/>
    <circle cx="42.5" cy="27.5" r="4" fill="url(#opticGlow)" filter="url(#neon)"/>
    <circle cx="42.5" cy="27.5" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="44" cy="26" r="0.9" fill="#ffffff"/>
  </g>

  <!-- WALL-E Neck & Chest Plate -->
  <path d="M 24 37 L 40 37 L 38 43 L 26 43 Z" fill="#334155" stroke="#1e293b" stroke-width="0.8"/>
  <rect x="22" y="43" width="20" height="9" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.8"/>

  <!-- WALL-E Solar Charge Gauge (Iconic Solar Battery Cells) -->
  <g transform="translate(24, 45.5)">
    <rect x="0" y="0" width="3" height="4" rx="0.6" fill="#ef4444"/>
    <rect x="4" y="0" width="3" height="4" rx="0.6" fill="#f59e0b"/>
    <rect x="8" y="0" width="3" height="4" rx="0.6" fill="#10b981"/>
    <rect x="12" y="0" width="3" height="4" rx="0.6" fill="#00e5ff" filter="url(#glow)"/>
  </g>

  <!-- Pippo Golden Beak / Energy Spike -->
  <polygon points="32,36 29,39 35,39" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Dual-Fleet Cyan & Amber Energy Pulse Dots -->
  <circle cx="10" cy="54" r="1.5" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="54" cy="54" r="1.5" fill="#ffd166" filter="url(#glow)"/>
</svg>
