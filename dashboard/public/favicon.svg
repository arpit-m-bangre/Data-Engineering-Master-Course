<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Warm Sunburst / Yellow Radial Glow -->
    <radialGradient id="cuteYellowBody" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff7a1"/>
      <stop offset="45%" stop-color="#ffd43f"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Cute Beak Gradient -->
    <linearGradient id="cuteOrangeBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Cheek Blush Glow -->
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <!-- Eye Sparkle Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- Cute Head Tuft / Feather Gradient -->
    <linearGradient id="tuftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cute Yellow Birdie Crest / Little Tuft -->
  <path d="M 32 14 C 28 4, 38 2, 34 14 Z" fill="url(#tuftGrad)" filter="url(#softGlow)"/>
  <path d="M 28 15 C 22 7, 30 6, 29 16 Z" fill="url(#tuftGrad)"/>
  <path d="M 36 15 C 42 7, 34 6, 35 16 Z" fill="url(#tuftGrad)"/>

  <!-- Round Cute Yellow Head & Body -->
  <ellipse cx="32" cy="36" rx="26" ry="24" fill="url(#cuteYellowBody)" filter="url(#softGlow)"/>
  <ellipse cx="32" cy="35" rx="25" ry="23" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Left Wing -->
  <ellipse cx="9" cy="39" rx="6" ry="10" transform="rotate(-20 9 39)" fill="#f59e0b"/>
  <ellipse cx="9" cy="39" rx="4.5" ry="8.5" transform="rotate(-20 9 39)" fill="url(#cuteYellowBody)"/>

  <!-- Right Wing -->
  <ellipse cx="55" cy="39" rx="6" ry="10" transform="rotate(20 55 39)" fill="#f59e0b"/>
  <ellipse cx="55" cy="39" rx="4.5" ry="8.5" transform="rotate(20 55 39)" fill="url(#cuteYellowBody)"/>

  <!-- Rosy Cute Blush Cheeks -->
  <circle cx="16" cy="40" r="6" fill="url(#cheekBlush)"/>
  <circle cx="48" cy="40" r="6" fill="url(#cheekBlush)"/>

  <!-- Cute Big Expressive Left Eye -->
  <ellipse cx="23" cy="32" rx="6.5" ry="8" fill="url(#eyeGrad)"/>
  <!-- Highlights -->
  <circle cx="21" cy="29" r="3" fill="#ffffff"/>
  <circle cx="25.5" cy="35" r="1.4" fill="#ffffff"/>
  <circle cx="21" cy="35.5" r="0.8" fill="#ffffff"/>

  <!-- Cute Big Expressive Right Eye -->
  <ellipse cx="41" cy="32" rx="6.5" ry="8" fill="url(#eyeGrad)"/>
  <!-- Highlights -->
  <circle cx="39" cy="29" r="3" fill="#ffffff"/>
  <circle cx="43.5" cy="35" r="1.4" fill="#ffffff"/>
  <circle cx="39" cy="35.5" r="0.8" fill="#ffffff"/>

  <!-- Little Cute Orange Beak -->
  <path d="M 27 36 Q 32 44 37 36 Q 32 39 27 36 Z" fill="url(#cuteOrangeBeak)"/>
  <ellipse cx="32" cy="38" rx="2.5" ry="1.2" fill="#fff" opacity="0.4"/>

  <!-- Happy Star Sparkles on Top -->
  <path d="M 52 14 L 54 18 L 58 20 L 54 22 L 52 26 L 50 22 L 46 20 L 50 18 Z" fill="#ffd166" opacity="0.9" filter="url(#softGlow)"/>
  <circle cx="11" cy="20" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="56" cy="48" r="1.2" fill="#fff" opacity="0.8"/>
</svg>
