<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arpit Bangre — Daily Data Engineering Mission Dashboard" />
    <meta name="author" content="Arpit Manoj Bangre" />
    <title>DE Mission Control</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="background-elements">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <div id="app" class="glass-container">
      <header>
        <div class="header-top">
          <h1><span class="emoji">🚀</span> <span class="gradient-text">DE Mission Control</span></h1>
          <button id="refresh-btn" title="Refresh tasks from live source" aria-label="Refresh tasks">
            <span class="refresh-icon">⟳</span>
          </button>
        </div>
        <p id="date-display">Loading...</p>
        <p id="last-updated" class="last-updated"></p>
      </header>

      <main>
        <div id="tasks-container" class="tasks-list">
          <div class="loading-pulse">Loading mission parameters...</div>
        </div>
      </main>

      <footer class="dash-footer">
        <span>📖 Data Engineering Master Course · Batch 15</span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
